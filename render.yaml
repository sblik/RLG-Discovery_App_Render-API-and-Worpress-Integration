services:
  - type: web
    name: discovery-one-stop
    env: python
    buildCommand: apt-get update && apt-get install -y $(cat packages.txt) && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
